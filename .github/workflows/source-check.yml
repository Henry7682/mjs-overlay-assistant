name: Source syntax
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source without running Windows automation
        run: python -m compileall -q mjs_assistant tools tests main.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install hash-locked wheels
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Python (Get-Command python).Source -Development
      - name: Verify dependencies and models
        run: |
          .\.venv\Scripts\python.exe -m pip check
          .\.venv\Scripts\python.exe tools/restore_models.py
          powershell -NoProfile -ExecutionPolicy Bypass -File .\start-source.ps1 -CheckOnly
      - name: Unit and replay tests (no game or mini program input)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -X utf8 -m pytest -q
      - name: Build candidate executable
        run: .\.venv\Scripts\python.exe -X utf8 -m PyInstaller --noconfirm MjsOverlay.spec
      - name: Offline frozen self-check
        shell: pwsh
        run: |
          $env:MJS_ASSISTANT_HOME=Join-Path $env:RUNNER_TEMP 'mjs-smoke-data'
          $report=Join-Path $env:RUNNER_TEMP 'mjs-smoke.json'
          $p=Start-Process -FilePath '.\dist\MjsOverlay\MjsOverlay.exe' -ArgumentList @('--smoke',('"'+$report+'"')) -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Frozen smoke failed' }
          $identity=(Get-Content -Raw -LiteralPath $report | ConvertFrom-Json).build
          if ($identity.channel -ne 'development' -or $identity.commit -ne $env:GITHUB_SHA) { throw 'Frozen build identity mismatch' }
          Get-Content -LiteralPath $report
